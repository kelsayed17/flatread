name: Bug report
description: A reader returns something other than what the file holds, or fails on a file it should read.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for reporting. For a security problem (a decompression bomb, a path escaping an archive), do not open
        an issue: use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: >
        The row struct and reader, and the smallest bytes that show it (inline, or a link to the publisher's file).
      render: python
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: The flatread tag you installed and the output of `python --version`.
      render: text
    validations:
      required: true
