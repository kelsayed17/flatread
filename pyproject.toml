[project]
name = "flatread"
version = "5.0.0"
description = "Read a provider's published files (CSV, workbooks, fixed-width, XML, HTML, PDF, SDMX) into typed rows, exactly, or fail loudly."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Khaled Elsayed" }]
requires-python = ">=3.14"
keywords = ["csv", "delimited", "parsing", "polars", "msgspec", "excel", "zip", "xml", "html", "pdf", "sdmx", "data-quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
# Each floor is the oldest version the suite is known to pass on.
dependencies = [
    "msgspec>=0.22",  # the row structs a layout reads into, and the JSON decode
    "polars>=2.0",  # the frames every read builds
    # Windows has no system time zone database: polars builds a UTC datetime cell's Python value through zoneinfo,
    # which reads the IANA data from tzdata there.
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Each extra brings one format family's parsers; a module of another family never imports them (the import-linter
# contracts below), so a CSV-only consumer installs none.
# flatread.sheets: xlsx through fastexcel (calamine), legacy .xls through xlrd.
excel = ["fastexcel>=0.21", "polars[calamine]>=2.0", "xlrd>=2.0.2"]
# flatread.markup and flatread.sdmx: XML through lxml's strict etree.
xml = ["lxml>=6.1.1"]
# flatread.pages: HTML pages, Scrapling over lxml's lenient libxml2 parser.
html = ["lxml>=6.1.1", "scrapling>=0.4.15"]
# flatread.pdf: a PDF's text layer, through pdfminer.six.
pdf = ["pdfminer.six>=20260107"]

[project.urls]
Repository = "https://github.com/kelsayed17/flatread"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flatread = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"

[dependency-groups]
# The tests and the gates in .github/workflows/ci.yml.
dev = [
    "flatread[excel,xml,html,pdf]",  # the suite reads every format
    "lxml-stubs>=0.5.1",  # lxml ships no type stubs
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",  # asyncio_mode = "auto" above: StreamedZip reads async chunks
    "pytest-cov>=7.1.0",
    "pytest-codspeed>=5.0.3",  # benchmarks/test_speed.py, the CodSpeed job
    "ruff>=0.16.7",
    "ty>=0.0.86",
    "deptry>=0.25.1",  # [tool.deptry]: the dependencies against what src/ imports
    "import-linter>=2.15",  # [tool.importlinter]: the module layers
    "typos>=1.51.1",
]

[tool.uv]
# uv ignores any distribution uploaded less than 3 days before a resolve; `uv sync --locked` installs the lock as written.
exclude-newer = "3 days"

[tool.coverage.run]
source = ["flatread"]
branch = true

[tool.coverage.report]
# Two decimals: a rounded "100%" would hide a miss.
precision = 2
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # A stub body: `...` alone on its line, or after a one-line signature's colon.
    '^\s*\.\.\.\s*$',
    ':\s*\.\.\.\s*$',
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
# Every rule, minus the few below; each is ignored for the reason beside it.
select = ["ALL"]
ignore = [
    # pydocstyle's mutually exclusive pairs: the summary sits on the first line (D212, not D213) and a class docstring
    # follows its `class` line directly (D211, not D203).
    "D203", "D213",
    # The formatter owns trailing commas; ruff warns that this rule conflicts with it.
    "COM812",
    # No per-file license header: the repository carries one LICENSE file.
    "CPY001",
    # A TODO is tracked debt, not a defect: TD003 holds each one to a linked issue.
    "FIX002",
]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.isort]
known-first-party = ["flatread"]

[tool.ruff.lint.flake8-type-checking]
# msgspec reads a Struct's field annotations at runtime to decode into it, so their imports stay at runtime.
runtime-evaluated-base-classes = ["msgspec.Struct"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Python 3.14 defers every annotation (PEP 649); the future import would stringify them again."

[tool.ruff.lint.per-file-ignores]
# Python 3.14 evaluates an annotation when it is read, so a name imported only under TYPE_CHECKING breaks
# inspect.signature on the public API (tests/test_signatures_resolve.py): src keeps its imports at runtime.
"src/**" = ["TC001", "TC002", "TC003"]
# A benchmark's name says what it times; pytest collects the directory without a package.
"benchmarks/**" = ["D1", "INP001"]
"tests/**" = [
    # Docstrings are required in src; a test's name says what it checks.
    "D1", "D205",
    # pytest's assertions are bare asserts that compare against literal expected values.
    "S101", "PLR2004",
    # A test reads the private state a reader builds.
    "SLF001",
    # Test names quote the identifiers they test.
    "N802",
    # tmp_path reads inside an async test touch a local temp dir; nothing else runs on that loop.
    "ASYNC240",
    # A test's parameters are its fixtures and parametrize columns, however many the case needs.
    "PLR0913", "PLR0917",
    # An expected value is the naive wall time a zoneless file writes, as the reader returns it.
    "DTZ001", "DTZ007",
    # A read float is compared exactly with the literal it was read from: equality is what is tested.
    "RUF069",
    # A layout's settings are class attributes; flatread reads them, never mutates them.
    "RUF012",
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.analysis]
# `# type: ignore` belongs to mypy and pyright; a ty finding is suppressed with `# ty: ignore[<rule>]`.
respect-type-ignore-comments = false

[tool.ty.rules]
# Strict: every rule is an error.
all = "error"

[tool.ty.terminal]
# And a diagnostic that still lands as a warning fails the run.
error-on-warning = true

[tool.deptry]
known_first_party = ["flatread"]

[tool.deptry.per_rule_ignores]
# tzdata is data zoneinfo reads on Windows (see [project.dependencies]), never imported.
DEP002 = ["tzdata"]


[tool.importlinter]
root_packages = ["flatread"]
# The format parsers are named in the contracts below, so the graph holds the external packages too.
include_external_packages = true

[[tool.importlinter.contracts]]
# A module per format family, each importing only the ones below it, and errors under them all. layout reads a stacked
# header through File._joined_header, so it never imports sheets; sheets reads a found table's lines from a workbook,
# so found sits below it.
name = "The readers are layered by format family"
type = "layers"
containers = ["flatread"]
layers = [
    "pages | pdf | sdmx",
    "reports",
    "delimited | sheets | fixed | markup",
    "layout | archives | found | grids",
    "core",
    "fields",
    "errors",
]

[[tool.importlinter.contracts]]
# A CSV, sheet or fixed-width reader never loads the HTML, PDF or XML parsers: its consumer need not install their
# extras, nor pay for them at import. Root packages only: import-linter 2.15 refuses an external subpackage (lxml.html).
name = "The plain-text and sheet readers load no HTML, PDF or XML parser"
type = "forbidden"
source_modules = [
    "flatread.archives",
    "flatread.core",
    "flatread.delimited",
    "flatread.errors",
    "flatread.fields",
    "flatread.fixed",
    "flatread.found",
    "flatread.grids",
    "flatread.layout",
    "flatread.sheets",
]
forbidden_modules = ["lxml", "pdfminer", "scrapling"]

[[tool.importlinter.contracts]]
# Only the workbook readers, flatread.sheets, load the workbook libraries (the excel extra).
name = "Only the workbook readers load fastexcel and xlrd"
type = "forbidden"
source_modules = [
    "flatread.archives",
    "flatread.core",
    "flatread.delimited",
    "flatread.errors",
    "flatread.fields",
    "flatread.fixed",
    "flatread.found",
    "flatread.grids",
    "flatread.layout",
    "flatread.markup",
    "flatread.pages",
    "flatread.pdf",
    "flatread.reports",
    "flatread.sdmx",
]
forbidden_modules = ["fastexcel", "xlrd"]

[tool.typos.default]
locale = "en-us"

[tool.typos.default.extend-words]
# A publisher's token for a value not published ("ND", no data), not a misspelling.
ND = "ND"
# The first letters of "café" before its escaped é (b"caf\xe9"), the cp1252 byte a test decodes.
caf = "caf"
# tests/test_real_files.py asserts recorded files' words as written: EIA's PADD regions and its "5-Year Maxium"
# heading, and the Philadelphia Fed's SPFfor_Step columns.
PADD = "PADD"
Maxium = "Maxium"
Ffor = "Ffor"

[tool.typos.files]
# The examples keep a recorded file's bytes, the publisher's own words and abbreviations (PADD, Infor, Consol).
extend-exclude = ["uv.lock", "docs/examples/"]
